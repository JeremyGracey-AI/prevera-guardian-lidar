# Runs the ROS-free test suite the README documents, on the Jetson's Python floor (3.10, numpy 1.x), plus the
# two file checks that do not need hardware: the URDF expands, and the step-9 label sidecars validate.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the harness requirements (numpy<2, as on the Jetson)
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/bag_analysis/requirements.txt pytest xacro
          python -c "import sys, numpy, sklearn; print(sys.version.split()[0], numpy.__version__, sklearn.__version__)"
      - name: Test suite (ROS-free core, replay harness, keypoint scorer, label sidecars)
        working-directory: src/prevera_perception
        run: PYTHONPATH=. python -m pytest test/ -q
      - name: URDF expands (floor mount, and the original rig behind the arg)
        run: |
          python -c "import xacro; xacro.process_file('src/prevera_description/urdf/sentinel.urdf.xacro')"
          python -c "import xacro; xacro.process_file('src/prevera_description/urdf/sentinel.urdf.xacro', mappings={'lidar_mount_height': '0.65'})"
      - name: Shell scripts parse
        run: |
          for f in jetson/*.sh setup_jetson.sh; do bash -n "$f"; done
          sh -n tools/git-hooks/pre-push
